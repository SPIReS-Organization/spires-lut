name: Build and Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build + import smoke on Python ${{ matrix.python-version }}
    # ubuntu-latest (26.04) has no setup-python build for 3.9 (EOL)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for setuptools-scm

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install wheel with test extras
        run: pip install "$(ls dist/*.whl)[test]"

      - name: Smoke-test installed wheel from outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import importlib.metadata as m, spires_lut, spires_lut.pyrt.aerosol; print(spires_lut.__file__, m.version('spires-lut'))"
          python -c "from spires_lut.sensors import get_sensor; from spires_lut.sensors.convolve import band_weights, DISORT_GRID_NM; b = get_sensor('OLI').bands[0]; w = band_weights(b, DISORT_GRID_NM); assert abs(w.sum() - 1) < 1e-9; print('bundled SRF ok', b.srf_file)"

      - name: Run tests
        run: pytest -q
