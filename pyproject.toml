[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spires-lut"
version = "0.1.0"
description = "SPIReS lookup tables: create, read, and write reflectance LUTs"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Niklas Griessbaum" }]
keywords = ["snow", "remote sensing", "xarray", "lookup table", "Mie scattering"]
dependencies = [
    "spires-contract",
    "xarray",
    "h5py",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/SPIReS-Organization/spires-lut"
Repository = "https://github.com/SPIReS-Organization/spires-lut"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
