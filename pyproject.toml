[build-system]
requires = ["meson-python", "wheel", "numpy"]
build-backend = "mesonpy"


[project]
name = "spires-lut"
dynamic = ["version"]  # meson-python reads it from project(version:) in meson.build
description = "SPIReS lookup tables: create, read, and write reflectance LUTs"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Niklas Griessbaum" }]
keywords = ["snow", "remote sensing", "xarray", "lookup table", "Mie scattering"]
dependencies = [
    "spires-contract @ git+https://github.com/SPIReS-Organization/spires-contract.git@v2.0.0",
    "numpy",
    "ninja",
    "pandas",
    "scipy",
    "xarray",
    "pooch",
    "joblib",
    "h5py",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest", "netCDF4"]
tools = ["openpyxl"]

[project.urls]
Homepage = "https://github.com/SPIReS-Organization/spires-lut"
Repository = "https://github.com/SPIReS-Organization/spires-lut"

[tool.setuptools.packages.find]
where = ["."]
include = ["spires_lut", "spires_lut.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"
