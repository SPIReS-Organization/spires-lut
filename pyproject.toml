[build-system]
requires = ["meson-python", "wheel", "numpy"]
build-backend = "mesonpy"

[project]
name = "spires-lut"
version = "0.1.0"
description = "SPIReS lookup tables: create, read, and write reflectance LUTs"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Niklas Griessbaum" }]
keywords = ["snow", "remote sensing", "xarray", "lookup table", "Mie scattering"]
dependencies = [
    "numpy",
    "ninja",
    "pandas",
    "scipy",
    "xarray",
    "pooch",
    "joblib",
    "h5py",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/SPIReS-Organization/spires-lut"
Repository = "https://github.com/SPIReS-Organization/spires-lut"

[tool.setuptools.packages.find]
where = ["."]
include = ["spires_lut", "spires_lut.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["spires_lut"]
